<script type="module">
  // Zeichnet die ```mermaid-Bloecke als Diagramm. Braucht Internet (CDN).
  // Ohne Verbindung bleibt der Quelltext des Diagramms als Code stehen.
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  document.querySelectorAll("pre.mermaid").forEach((pre) => {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = pre.textContent;
    pre.replaceWith(div);
  });
  const dunkel = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dunkel ? "dark" : "default" });
  await mermaid.run();
</script>
